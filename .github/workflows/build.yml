name: Build FR

on:
  push:
    branches: [develop, master, master-asm]
    tags: ['v*']
  pull_request:
    branches: [develop, master, master-asm]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-natives:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: patches

      - name: Cache natives
        id: cache
        uses: actions/cache@v5
        with:
          path: natives
          key: ${{ matrix.arch }}-natives-${{ hashFiles('patches/**') }}

      - name: Setup Java
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build natives
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p natives
          git clone https://github.com/shadowfacts/lwjgl2-arm64.git
          cd lwjgl2-arm64
          git checkout 08c5bb19
          git apply "$GITHUB_WORKSPACE/patches/lwjgl2-native-fullscreen.patch"

          sed -i '' 's/source="1.7"/source="1.8"/g; s/target="1.7"/target="1.8"/g' \
            build.xml platform_build/build-generator.xml

          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            sed -i '' \
              's/-arch arm64/-arch x86_64/g;
               s|dir="arm64"|dir="x86_64"|g;
               s|location="arm64"|location="x86_64"|g;
               s|path="arm64"|path="x86_64"|g;
               s|file="arm64/liblwjgl-arm64.dylib"|file="x86_64/liblwjgl-x86_64.dylib"|g;
               s|value="liblwjgl-arm64.dylib"|value="liblwjgl-x86_64.dylib"|g;
               s|-ljawt|-Wl,-undefined,dynamic_lookup|g' \
              platform_build/macosx_ant/build.xml
          fi

          ant generate-all compile headers
          mkdir -p bin/lwjgl && cd bin/lwjgl
          ant -f ../../platform_build/macosx_ant/build.xml \
            -Djvm_headers_path="$JAVA_HOME/include/" nativelibrary
          cp liblwjgl.dylib "$GITHUB_WORKSPACE/natives/"

      - name: Get openal (ARM only)
        if: steps.cache.outputs.cache-hit != 'true' && matrix.arch == 'arm64'
        run: |
          brew install openal-soft
          cp $(brew --prefix openal-soft)/lib/libopenal.dylib natives/openal.dylib

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.arch }}-natives
          path: natives/*

  build-fr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Download dependencies
        run: |
          mkdir -p jars/lib && cd jars/lib
          BASE=https://repo1.maven.org/maven2
          curl -sLO $BASE/org/lwjgl/lwjgl/lwjgl/2.9.3/lwjgl-2.9.3.jar
          curl -sLO $BASE/org/lwjgl/lwjgl/lwjgl_util/2.9.3/lwjgl_util-2.9.3.jar
          curl -sLO $BASE/log4j/log4j/1.2.9/log4j-1.2.9.jar
          curl -sLO $BASE/org/codehaus/janino/janino/2.7.8/janino-2.7.8.jar
          curl -sLO $BASE/org/codehaus/janino/commons-compiler/2.7.8/commons-compiler-2.7.8.jar
          curl -sLO $BASE/com/thoughtworks/xstream/xstream/1.4.10/xstream-1.4.10.jar
          curl -sLO $BASE/org/json/json/20231013/json-20231013.jar
          curl -sLO $BASE/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar

      - name: Compile
        run: |
          javac --release 17 \
            -cp "jars/compile/api_stubs.jar:jars/lib/*" \
            -sourcepath modules/renderer/src:modules/proxy/src:modules/methods/src:modules/agent/src \
            -d build/classes \
            $(find modules/renderer/src modules/agent/src -name "*.java")

      - name: Copy resources
        run: |
          find modules/renderer/src modules/agent/src -type f ! -name "*.java" | while read f; do
            for src in modules/renderer/src modules/agent/src; do
              case "$f" in
                "$src/"*) dest="build/classes/${f#$src/}"; mkdir -p "$(dirname "$dest")"; cp "$f" "$dest";;
              esac
            done
          done

      - name: Bundle ASM
        run: cd build/classes && jar xf ../../jars/lib/asm-9.7.1.jar org/

      - name: Package fr.agent.jar
        run: |
          cd build/classes
          jar cf ../fr.agent.jar com/genir/renderer/agent/ com/genir/renderer/hooks/ org/ mappings/
          jar ufm ../fr.agent.jar ../../modules/agent/MANIFEST.MF
          cd ..

      - name: Package fr.jar
        run: |
          rm -rf build/classes/proxy
          # Strip methods-module stubs (com/fs/**) — they shadow real game
          # classes when fr.jar precedes starfarer_obf.jar on the classpath.
          rm -rf build/classes/com/fs
          jar cf build/fr.jar -C build/classes .

      - name: Package Windows
        run: |
          mkdir -p out/windows
          cp build/fr.jar build/fr.agent.jar fr.bat fr.vmparams FR_SS.ico readme.txt out/windows/

      - name: Package macOS
        run: |
          mkdir -p out/macos/Contents/MacOS out/macos/Contents/Resources/Java
          cp build/fr.jar build/fr.agent.jar out/macos/Contents/Resources/Java/
          cp scripts/starsector_mac.sh out/macos/Contents/MacOS/
          cp scripts/starsector_mac.sh.original out/macos/Contents/MacOS/
          chmod +x out/macos/Contents/MacOS/starsector_mac.sh

      - name: Package Linux
        run: |
          mkdir -p out/linux
          cp build/fr.jar build/fr.agent.jar out/linux/
          cp scripts/starsector_linux_fr.sh out/linux/starsector-fr.sh
          chmod +x out/linux/starsector-fr.sh

      - uses: actions/upload-artifact@v5
        with:
          name: fr-windows
          path: out/windows

      - uses: actions/upload-artifact@v5
        with:
          name: fr-macos
          path: out/macos

      - uses: actions/upload-artifact@v5
        with:
          name: fr-linux
          path: out/linux

  package-macos-arm:
    needs: [build-fr, build-natives]
    runs-on: macos-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v5
        with:
          name: fr-macos
          path: pkg

      - uses: actions/download-artifact@v5
        with:
          name: arm64-natives
          path: arm64-natives

      - name: Build minimal JRE
        run: |
          jlink --add-modules java.base,java.desktop,java.xml,java.logging,java.management,jdk.management,java.instrument,java.compiler,java.prefs,jdk.unsupported,jdk.charsets,java.sql,jdk.jfr \
            --strip-debug --no-man-pages --no-header-files --compress zip-6 \
            --output pkg/Contents/Home-arm

      - name: Add ARM natives
        run: |
          mkdir -p pkg/Contents/Resources/Java/native/macosx-arm
          cp arm64-natives/liblwjgl.dylib pkg/Contents/Resources/Java/native/macosx-arm/
          cp arm64-natives/openal.dylib pkg/Contents/Resources/Java/native/macosx-arm/
          curl -sL "https://repo1.maven.org/maven2/io/github/darkxanter/webp-imageio/0.3.3/webp-imageio-0.3.3.jar" \
            -o pkg/Contents/Resources/Java/native/macosx-arm/webp-imageio-0.1.6.jar

      - uses: actions/upload-artifact@v5
        with:
          name: fr-macos-arm
          path: pkg

  release:
    needs: [build-fr, package-macos-arm, build-natives]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5

      - name: Prepare release
        run: |
          cd fr-windows && zip -qr ../fr-windows.zip * && cd ..
          chmod +x fr-macos/Contents/MacOS/starsector_mac.sh
          cd fr-macos && zip -qr ../fr-macos.zip Contents && cd ..
          chmod +x fr-macos-arm/Contents/MacOS/starsector_mac.sh
          chmod +x fr-macos-arm/Contents/Home-arm/bin/*
          cd fr-macos-arm && zip -qr ../fr-macos-arm-jre.zip Contents && cd ..
          chmod +x fr-linux/starsector-fr.sh
          cd fr-linux && zip -qr ../fr-linux.zip * && cd ..
          cp arm64-natives/liblwjgl.dylib liblwjgl-arm64.dylib
          cp x86_64-natives/liblwjgl.dylib liblwjgl-x86_64.dylib

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ github.event.base_ref != 'refs/heads/master' }}
          files: |
            fr-windows.zip
            fr-macos.zip
            fr-macos-arm-jre.zip
            fr-linux.zip
            liblwjgl-arm64.dylib
            liblwjgl-x86_64.dylib
